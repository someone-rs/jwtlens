[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jwtlens"
version = "1.0.0"
description = "Decode, verify and mint JSON Web Tokens from your terminal — offline, stdlib-only"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "someone-rs"}]
keywords = ["jwt", "token", "security", "cli", "jose"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/someone-rs/jwtlens"
Repository = "https://github.com/someone-rs/jwtlens"
Issues = "https://github.com/someone-rs/jwtlens/issues"

[project.scripts]
jwtlens = "jwtlens.cli:main"

[tool.setuptools]
packages = ["jwtlens"]
